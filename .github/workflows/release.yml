# Based partially on Alyxia's work, thanks so much!

name: Release
on:
  push:
    tags:
      - v*
env:
  FORCE_COLOR: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Go dependencies
        run: go get -v

      - name: Build Cli
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -tags "static cli" -ldflags "-s -w" -o Dev33nzyCli-linux

      - name: Update executable
        run: |
          chmod +x Dev33nzyCli-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dev33nzy-linux
          path: |
            Dev33nzyCli-linux


  build-mac:
    runs-on: macos-latest

    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - id: go-cache-paths
        run: |
          echo "go_build=$(go env GOCACHE)" >> $GITHUB_ENV
          echo "go_mod=$(go env GOMODCACHE)" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: brew install pkg-config sdl2

      - name: Install Go dependencies
        run: go get -v

      - name: Build
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -v -tags static -ldflags "-s -w" -o Dev33nzy

      - name: Update executable
        run: |
          chmod +x Dev33nzy

      - name: Generate MacOS bundle
        run: |
          mkdir -p Dev33nzy.app/Contents/MacOS
          mkdir -p Dev33nzy.app/Contents/Resources
          cp macos/Info.plist Dev33nzy.app/Contents/Info.plist
          mv Dev33nzy Dev33nzy.app/Contents/MacOS/Dev33nzy
          cp macos/icon.icns Dev33nzy.app/Contents/Resources/icon.icns
          zip -r Dev33nzy.MacOS.zip Dev33nzy.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dev33nzy-macos
          path: Dev33nzy.MacOS.zip


  build-windows:
    runs-on: windows-latest

    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2

      - name: Install Windows dependencies
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-go
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64

      - name: Install Go dependencies
        shell: msys2 {0}
        run: |
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          go get -v
          go install github.com/tc-hib/go-winres@latest

      - name: Build Gui
        shell: msys2 {0}
        run: |
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          go-winres make --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags static -ldflags "-s -w -H=windowsgui -extldflags=-static" -o Dev33nzy.exe

      - name: Build i386 Cli
        shell: msys2 {0}
        run: |
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -v -tags "static cli" -ldflags "-s -w -extldflags=-static" -o Dev33nzyCli.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dev33nzy-windows
          path: |
            Dev33nzy.exe
            Dev33nzyCli.exe


  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-mac, build-windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Dev33nzy-linux
          path: linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Dev33nzy-macos
          path: macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Dev33nzy-windows
          path: windows

      - name: Create the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: false
          draft: false
          files: |
            linux/Dev33nzyCli-linux
            macos/Dev33nzy.MacOS.zip
            windows/Dev33nzy*.exe
