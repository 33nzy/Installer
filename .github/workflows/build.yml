name: Build Cross-Platform Installers

on:
  push:
    tags:
      - 'v*'  # يبني لما تسوي tag جديد مثل v1.0.0

jobs:
  # ==================== Windows Build ====================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build executable with pkg
        run: npx pkg . --targets node18-win-x64 --output dist/app-win.exe

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/setup.iss
          options: /O+

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/output/*.exe

  # ==================== macOS Build ====================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build executable with pkg
        run: npx pkg . --targets node18-macos-x64 --output dist/app-macos

      - name: Create DMG Installer
        uses: L-Super/create-dmg-actions@v1.0.3
        with:
          dmg_name: 'app-installer'
          src_dir: 'dist'

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: '*.dmg'

  # ==================== Linux Build ====================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build executable with pkg
        run: npx pkg . --targets node18-linux-x64 --output dist/app-linux

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/app-linux

  # ==================== Upload to Release ====================
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-installer/*.exe
            macos-installer/*.dmg
            linux-binary/app-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
